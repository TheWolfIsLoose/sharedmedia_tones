name: Package and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # release.sh reads tags and history to build the changelog,
          # so a shallow clone is not enough.
          fetch-depth: 0

      - name: Package and attach to release
        # GitHub-only: builds the zip and attaches it to the GitHub release.
        # CurseForge is not called from here — it picks up new tags itself via
        # its own webhook-based Automatic Packaging, configured on curseforge.com.
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
