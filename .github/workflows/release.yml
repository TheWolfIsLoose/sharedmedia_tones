name: Package and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # release.sh reads tags and history to build the changelog,
          # so a shallow clone is not enough.
          fetch-depth: 0

      - name: Package and attach to release
        # CurseForge's own webhook-based Automatic Packaging has a known
        # platform-side issue (confirmed by other addon authors as of early
        # 2026): it accepts the webhook delivery but never produces a file.
        # Until that's fixed on their end, this step pushes directly to
        # CurseForge via their upload API as a reliable fallback. It quietly
        # skips that step if CF_API_TOKEN isn't set. Wago is unaffected and
        # still picks up releases via its own webhook + the X-Wago-ID in the
        # .toc, so no token is needed for Wago here.
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1691590
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
